<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom Style -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="overflow-hidden select-none">

    <!-- Settings Modal -->
    <div id="settings-modal"
        class="hidden absolute inset-0 z-50 flex items-center justify-center bg-black bg-opacity-70 backdrop-blur-sm">
        <div class="bg-gray-900 border border-gray-700 p-6 rounded-xl w-80 shadow-2xl flex flex-col space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="text-white text-lg font-bold">Setup API Key</h2>
                <button id="close-settings-btn" class="text-gray-400 hover:text-white transition no-drag">
                    <i class="fa-solid fa-times"></i>
                </button>
            </div>

            <div class="text-gray-400 text-xs text-justify leading-relaxed">
                Enter your Google Gemini API Key. The key is stored locally on your machine.
            </div>

            <input type="password" id="api-key-input" placeholder="AI..."
                class="w-full p-2 rounded bg-gray-800 text-white border border-gray-600 focus:outline-none focus:border-blue-500 transition no-drag text-sm">

            <button id="save-key-btn"
                class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-4 rounded transition no-drag text-sm">
                Save & Start
            </button>
        </div>
    </div>

    <!-- Main Container -->
    <div class="h-screen w-screen flex flex-col glass-container relative group">

        <!-- Header (Drag Region) -->
        <div
            class="h-10 flex items-center justify-between px-4 drag-region pywebview-drag-region cursor-move shrink-0 bg-white/5 hover:bg-white/10 transition-colors">

            <!-- Left: Title -->
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-robot text-blue-400 text-sm"></i>
                <div class="text-xs font-bold text-gray-300 tracking-wider">AI ASSISTANT</div>
            </div>

            <!-- Right: Actions -->
            <div class="flex items-center space-x-3">
                <button id="settings-btn" class="text-gray-400 hover:text-white transition no-drag" title="Settings">
                    <i class="fa-solid fa-gear"></i>
                </button>
                <div class="h-4 w-[1px] bg-gray-600"></div>
                <button id="close-app-btn" class="text-gray-400 hover:text-red-500 transition no-drag"
                    title="Close App">
                    <i class="fa-solid fa-power-off"></i>
                </button>
            </div>
        </div>

        <!-- Chat Area -->
        <div id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-3 custom-scrollbar">
            <!-- Messages will be injected here -->
            <div class="flex flex-col space-y-1">
                <div
                    class="self-start bg-gray-800 bg-opacity-60 text-gray-200 px-3 py-2 rounded-2xl rounded-tl-none max-w-[85%] text-sm">
                    Olá! Como posso ajudar você hoje?
                </div>
            </div>
        </div>

        <!-- Footer / Input Area -->
        <div class="p-4 shrink-0">
            <div
                class="flex items-end space-x-2 bg-gray-800 bg-opacity-50 p-2 rounded-2xl border border-gray-700 backdrop-blur-sm">

                <button id="vision-btn" class="p-2 text-gray-400 hover:text-blue-400 transition no-drag rounded-full"
                    title="Analyze Screen">
                    <i class="fa-solid fa-eye"></i>
                </button>

                <textarea id="user-input" rows="1"
                    class="flex-1 bg-transparent text-white placeholder-gray-500 text-sm focus:outline-none resize-none py-2 no-drag custom-scrollbar"
                    placeholder="Ask me anything..."></textarea>

                <button id="mic-btn" class="p-2 text-gray-400 hover:text-red-400 transition no-drag rounded-full"
                    title="Record Audio">
                    <i class="fa-solid fa-microphone"></i>
                </button>

                <button id="send-btn" class="p-2 text-gray-400 hover:text-green-400 transition no-drag rounded-full"
                    title="Send">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>

    </div>

    <script src="app.js"></script>
</body>

</html>
